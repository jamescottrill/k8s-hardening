# A core add-on in a listed non-tenant project is left alone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: core-cert-manager, namespace: argocd}
spec:
  project: default
  source: {repoURL: https://charts.jetstack.io, chart: cert-manager, targetRevision: v1.19.1}
  destination: {server: https://kubernetes.default.svc, namespace: cert-manager}
---
# An unlisted project is treated as a tenant and refused (fails safe).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: core-unlisted, namespace: argocd}
spec:
  project: core
  source: {repoURL: https://charts.jetstack.io, chart: cert-manager, targetRevision: v1.19.1}
  destination: {server: https://kubernetes.default.svc, namespace: cert-manager}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-steal
  namespace: argocd
  labels: {platform.example.com/tenant: myapp}
spec:
  project: myapp
  source: {repoURL: https://github.com/example-org/myapp-web.git, path: ., targetRevision: main}
  destination: {server: https://kubernetes.default.svc, namespace: teamb-api}
  syncPolicy:
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels: {platform.example.com/tenant: myapp, platform.example.com/tenant-registry: "true", pod-security.kubernetes.io/enforce: restricted}
---
