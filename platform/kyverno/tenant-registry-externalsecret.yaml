# For every tenant namespace whose tenant has registry.enabled: true, generate an
# ExternalSecret that pulls that tenant's own registry credential from Vault
# (kv/tenants/<tenant>/registry) and materialises it as a dockerconfigjson Secret
# called tenant-registry.
#
# The Vault path is derived from the namespace's tenant label, which only the
# platform can set (tenant-namespace-guard), so a team can never point this at
# another team's credential.
#
# NOTE on \{{ ... }}: Kyverno substitutes its own {{ }} variables. The backslash
# escapes stop Kyverno touching the External Secrets template expressions, so the
# generated ExternalSecret contains a plain {{ .registry }} etc. for ESO to render.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-registry-externalsecret
  annotations:
    # After the wave 0 guards, so no credential is fanned out before the tenant
    # labels it keys off are protected.
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Tenant registry ExternalSecret
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Namespace, ExternalSecret
spec:
  rules:
    - name: generate-tenant-registry-externalsecret
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              selector:
                matchLabels:
                  platform.example.com/tenant-registry: "true"
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      generate:
        # Also back-fill namespaces that existed before this policy.
        generateExisting: true
        # Keep the ExternalSecret in line with this policy and remove it if the
        # namespace stops matching (for example registry.enabled set to false).
        synchronize: true
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        name: tenant-registry
        namespace: "{{ request.object.metadata.name }}"
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
              platform.example.com/tenant: '{{ request.object.metadata.labels."platform.example.com/tenant" }}'
          spec:
            refreshInterval: 1h
            secretStoreRef:
              kind: ClusterSecretStore
              name: platform-vault
            target:
              name: tenant-registry
              creationPolicy: Owner
              template:
                type: kubernetes.io/dockerconfigjson
                engineVersion: v2
                data:
                  .dockerconfigjson: '{"auths":{"\{{ .registry }}":{"auth":"\{{ printf "%s:%s" .username .password | b64enc }}"}}}'
            data:
              - secretKey: registry
                remoteRef:
                  key: 'tenants/{{ request.object.metadata.labels."platform.example.com/tenant" }}/registry'
                  property: registry
              - secretKey: username
                remoteRef:
                  key: 'tenants/{{ request.object.metadata.labels."platform.example.com/tenant" }}/registry'
                  property: username
              - secretKey: password
                remoteRef:
                  key: 'tenants/{{ request.object.metadata.labels."platform.example.com/tenant" }}/registry'
                  property: password
