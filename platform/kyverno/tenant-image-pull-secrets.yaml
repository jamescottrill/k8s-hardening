# Adds the pull secrets to every Pod in a tenant namespace at admission time.
#
# Why Pods and not the default ServiceAccount: ServiceAccount.imagePullSecrets has no
# strategic-merge key, so patching it replaces whatever is there, and it only covers
# Pods that use that ServiceAccount. PodSpec.imagePullSecrets merges by name, so this
# appends to anything the team already set and covers every ServiceAccount.
#
# autogen is disabled on purpose: otherwise Kyverno would also rewrite the pod
# templates of Deployments, StatefulSets and so on, which Argo CD would see as drift.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-image-pull-secrets
  annotations:
    # After the wave 0 guards, so no credential is fanned out before the tenant
    # labels it keys off are protected.
    argocd.argoproj.io/sync-wave: "1"
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Tenant image pull secrets
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Pod
spec:
  rules:
    - name: add-platform-registry
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: platform-registry

    - name: add-tenant-registry
      match:
        any:
          - resources:
              kinds: ["Pod"]
              operations: ["CREATE"]
              namespaceSelector:
                matchLabels:
                  platform.example.com/tenant-registry: "true"
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      mutate:
        patchStrategicMerge:
          spec:
            imagePullSecrets:
              - name: tenant-registry
