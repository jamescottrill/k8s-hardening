# CIS 5.1.5: default ServiceAccounts not actively used, and their tokens not mounted.
# CIS 5.1.6: ServiceAccount tokens only mounted where necessary (audit).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-service-accounts
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: CIS 5.1.5 and 5.1.6 ServiceAccount tokens
    policies.kyverno.io/category: CIS 5.1
    policies.kyverno.io/subject: ServiceAccount, Pod
spec:
  rules:
    # New default ServiceAccounts (created by kube-controller-manager with each namespace).
    - name: default-sa-no-automount
      match:
        any:
          - resources:
              kinds: ["ServiceAccount"]
              names: ["default"]
              operations: ["CREATE", "UPDATE"]
      exclude:
        any:
          - resources:
              namespaces: ["kube-system"]
      mutate:
        patchStrategicMerge:
          automountServiceAccountToken: false

    # Back-fill default ServiceAccounts that already exist when the policy is applied.
    - name: default-sa-no-automount-existing
      match:
        any:
          - resources:
              kinds: ["Namespace"]
      exclude:
        any:
          - resources:
              names: ["kube-system"]
      mutate:
        mutateExistingOnPolicyUpdate: true
        targets:
          - apiVersion: v1
            kind: ServiceAccount
            name: default
            namespace: "{{ request.object.metadata.name }}"
        patchStrategicMerge:
          automountServiceAccountToken: false

    # Visibility only: workloads that run as the default ServiceAccount.
    - name: audit-default-sa-in-use
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      validate:
        failureAction: Audit
        cel:
          expressions:
            - expression: >-
                has(object.spec.serviceAccountName) && object.spec.serviceAccountName != 'default'
              message: >-
                CIS 5.1.5 Workloads should use a dedicated ServiceAccount rather than default.

    # Visibility only: pods mounting an API token. Set automountServiceAccountToken: false
    # on pods (or their ServiceAccount) that never call the Kubernetes API.
    - name: audit-token-automount
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      validate:
        failureAction: Audit
        cel:
          expressions:
            - expression: >-
                has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
              message: >-
                CIS 5.1.6 Mount ServiceAccount tokens only where needed (set automountServiceAccountToken: false).
