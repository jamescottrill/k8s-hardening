# Argo CD applies whatever is in a team's repo with its own (cluster-wide) rights, so
# without this a team could ship a RoleBinding granting a group "admin" in their
# namespace, or a Role with wildcards. In tenant namespaces:
#
#   - Roles: no wildcards (CIS 5.1.3), no bind/escalate/impersonate (CIS 5.1.8),
#     no serviceaccounts/token create (CIS 5.1.13), nothing in platform-only API groups
#     (Kyverno, Argo CD, admission, CRDs), and writes only to the resources in
#     allowedWrites below. Otherwise a repo could grant its own ServiceAccount what the
#     AppProject refuses, and create it at runtime from a pod.
#
#     allowedWrites mirrors namespaceResources in charts/tenant/values.yaml (the
#     AppProject whitelist; tests/test_rbac.py checks they agree), plus what workloads
#     commonly need at runtime: Pods and their exec/eviction subresources (CI runners,
#     operators; Pod Security still applies), Leases (leader election) and Events.
#     When a tenant gets an extraNamespaceResources kind, add its resource here too.
#   - RoleBindings: may only reference a Role, and only bind ServiceAccounts from the
#     same namespace. Human access comes solely from tenant.yaml access: (generated by
#     Kyverno, which is excluded here).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-rbac-guard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Tenant RBAC guard
    policies.kyverno.io/category: Multi-Tenancy, CIS 5.1
    policies.kyverno.io/subject: Role, RoleBinding
spec:
  background: false
  rules:
    - name: tenant-roles-least-privilege
      match:
        any:
          - resources:
              kinds: ["Role"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      validate:
        failureAction: Enforce
        cel:
          variables:
            - name: allowedWrites
              expression: >-
                [
                  '/configmaps', '/secrets', '/services', '/serviceaccounts', '/persistentvolumeclaims',
                  '/pods', '/pods/exec', '/pods/attach', '/pods/portforward', '/pods/eviction', '/events',
                  'apps/deployments', 'apps/deployments/scale', 'apps/statefulsets', 'apps/statefulsets/scale',
                  'batch/jobs', 'batch/cronjobs',
                  'autoscaling/horizontalpodautoscalers', 'policy/poddisruptionbudgets',
                  'networking.k8s.io/ingresses', 'networking.k8s.io/networkpolicies',
                  'rbac.authorization.k8s.io/roles', 'rbac.authorization.k8s.io/rolebindings',
                  'external-secrets.io/externalsecrets', 'external-secrets.io/secretstores',
                  'gateway.networking.k8s.io/httproutes', 'gateway.networking.k8s.io/grpcroutes',
                  'networking.istio.io/virtualservices', 'networking.istio.io/destinationrules',
                  'security.istio.io/authorizationpolicies', 'cert-manager.io/certificates',
                  'monitoring.coreos.com/servicemonitors', 'monitoring.coreos.com/podmonitors',
                  'monitoring.coreos.com/prometheusrules',
                  'coordination.k8s.io/leases', 'events.k8s.io/events'
                ]
          expressions:
            - expression: >-
                !has(object.rules) || object.rules.all(r,
                  !('*' in r.verbs)
                  && !(has(r.resources) && '*' in r.resources)
                  && !(has(r.apiGroups) && '*' in r.apiGroups))
              message: Roles in tenant namespaces may not use wildcards (CIS 5.1.3). List verbs, resources and apiGroups explicitly.
            - expression: >-
                !has(object.rules) || object.rules.all(r,
                  !r.verbs.exists(v, v in ['bind', 'escalate', 'impersonate']))
              message: Roles in tenant namespaces may not grant bind, escalate or impersonate (CIS 5.1.8).
            - expression: >-
                !has(object.rules) || object.rules.all(r,
                  !(has(r.resources) && 'serviceaccounts/token' in r.resources && 'create' in r.verbs))
              message: Roles in tenant namespaces may not create ServiceAccount tokens (CIS 5.1.13).
            - expression: >-
                !has(object.rules) || object.rules.all(r, !has(r.apiGroups) || !r.apiGroups.exists(g, g in [
                  'kyverno.io', 'policies.kyverno.io', 'reports.kyverno.io', 'wgpolicyk8s.io',
                  'argoproj.io', 'admissionregistration.k8s.io', 'apiextensions.k8s.io',
                  'generators.external-secrets.io']))
              message: Roles in tenant namespaces may not grant anything in platform-only API groups (Kyverno, Argo CD, admission, CRDs).
            - expression: >-
                !has(object.rules) || object.rules.all(r,
                  !r.verbs.exists(v, !(v in ['get', 'list', 'watch']))
                  || (has(r.apiGroups) && has(r.resources)
                      && r.apiGroups.all(g, r.resources.all(res, (g + '/' + res) in variables.allowedWrites))))
              message: >-
                Roles in tenant namespaces may only grant writes to the resources tenants may deploy
                (the AppProject whitelist) plus pods, leases and events. Endpoints, EndpointSlices,
                quotas, DaemonSets, Istio ServiceEntries and Sidecars, ReferenceGrants, PushSecrets
                and any other kind are read-only.

    - name: tenant-rolebindings-serviceaccounts-only
      match:
        any:
          - resources:
              kinds: ["RoleBinding"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
          - subjects:
              - kind: Group
                name: platform-admins
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: object.roleRef.kind == 'Role'
              message: >-
                RoleBindings in tenant namespaces may only reference a Role. Human access is managed
                through tenant.yaml access: entries.
            - expression: >-
                has(object.subjects) && object.subjects.all(s,
                  s.kind == 'ServiceAccount' && (!has(s.namespace) || s.namespace == request.namespace))
              message: RoleBindings in tenant namespaces may only bind ServiceAccounts from the same namespace.
