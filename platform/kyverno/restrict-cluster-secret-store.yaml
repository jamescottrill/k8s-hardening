# The platform-vault ClusterSecretStore can read every tenant's registry path, and
# ESO lets any ExternalSecret in an allowed namespace reference a ClusterSecretStore
# with any key. Without this policy myapp could write an ExternalSecret for
# tenants/teamb/registry.
#
# So: in tenant namespaces, only Kyverno's generate controller and ESO itself (for
# ClusterExternalSecrets) may create ExternalSecrets that use a ClusterSecretStore.
# Teams remain free to use their own namespaced SecretStores.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-cluster-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Restrict ClusterSecretStore use in tenant namespaces
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: ExternalSecret
spec:
  background: false
  rules:
    - name: deny-tenant-clustersecretstore-refs
      match:
        any:
          - resources:
              kinds: ["external-secrets.io/v1/ExternalSecret"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: kyverno-background-controller
                namespace: kyverno
          - subjects:
              - kind: ServiceAccount
                name: external-secrets
                namespace: external-secrets
      # An UPDATE that leaves spec alone (for example the force-sync annotation on the
      # Kyverno-generated tenant-registry ExternalSecret) is allowed: it cannot change
      # which store or key is read.
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                (request.operation == 'UPDATE' && object.spec == oldObject.spec) ||
                !(has(object.spec.secretStoreRef) && has(object.spec.secretStoreRef.kind)
                  && object.spec.secretStoreRef.kind == 'ClusterSecretStore')
              message: >-
                Tenant ExternalSecrets may not use a ClusterSecretStore. Use a SecretStore in your
                own namespace, or ask the platform team.
            - expression: >-
                (request.operation == 'UPDATE' && object.spec == oldObject.spec) ||
                !has(object.spec.data) || object.spec.data.all(d,
                  !(has(d.sourceRef) && has(d.sourceRef.storeRef) && has(d.sourceRef.storeRef.kind)
                    && d.sourceRef.storeRef.kind == 'ClusterSecretStore'))
              message: Tenant ExternalSecrets may not use a ClusterSecretStore in spec.data[].sourceRef.
            - expression: >-
                (request.operation == 'UPDATE' && object.spec == oldObject.spec) ||
                !has(object.spec.dataFrom) || object.spec.dataFrom.all(d,
                  !(has(d.sourceRef) && has(d.sourceRef.storeRef) && has(d.sourceRef.storeRef.kind)
                    && d.sourceRef.storeRef.kind == 'ClusterSecretStore'))
              message: Tenant ExternalSecrets may not use a ClusterSecretStore in spec.dataFrom[].sourceRef.
