# Makes the tenant labels trustworthy, because every other policy and the
# ClusterSecretStore keys off them.
#
#  1. Only Argo CD's application controller (driven by the platform-owned
#     tenant-apps ApplicationSet) or platform admins may add, change or remove
#     the tenant labels on a Namespace.
#  2. A namespace labelled tenant=X must be named X or X-*. Combined with each
#     tenant's AppProject only allowing destinations X and X-*, myapp cannot obtain a
#     namespace labelled as team-b, even through Argo CD.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-namespace-guard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Tenant namespace guard
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Namespace
spec:
  # Subject-based exclusions only make sense at admission time.
  background: false
  rules:
    - name: tenant-labels-set-by-argocd-only
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              operations: ["CREATE", "UPDATE"]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: argocd-application-controller
                namespace: argocd
          # Match your OIDC groups claim, including any prefix set on the API server
          # (for example oidc:platform-admins).
          - subjects:
              - kind: Group
                name: platform-admins
          - subjects:
              - kind: Group
                name: system:masters
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                (has(object.metadata.labels) && 'platform.example.com/tenant' in object.metadata.labels
                  ? object.metadata.labels['platform.example.com/tenant'] : '')
                ==
                (request.operation == 'UPDATE' && has(oldObject.metadata.labels) && 'platform.example.com/tenant' in oldObject.metadata.labels
                  ? oldObject.metadata.labels['platform.example.com/tenant'] : '')
              message: >-
                The platform.example.com/tenant label is managed by the platform (Argo CD tenant-apps
                ApplicationSet) and cannot be set, changed or removed directly.
            - expression: >-
                (has(object.metadata.labels) && 'platform.example.com/tenant-registry' in object.metadata.labels
                  ? object.metadata.labels['platform.example.com/tenant-registry'] : '')
                ==
                (request.operation == 'UPDATE' && has(oldObject.metadata.labels) && 'platform.example.com/tenant-registry' in oldObject.metadata.labels
                  ? oldObject.metadata.labels['platform.example.com/tenant-registry'] : '')
              message: >-
                The platform.example.com/tenant-registry label is managed by the platform and cannot
                be set, changed or removed directly. Set registry.enabled in the tenant's tenant.yaml.

    - name: tenant-namespace-name-prefix
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              operations: ["CREATE", "UPDATE"]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                !(has(object.metadata.labels) && 'platform.example.com/tenant' in object.metadata.labels)
                || object.metadata.name == object.metadata.labels['platform.example.com/tenant']
                || object.metadata.name.startsWith(object.metadata.labels['platform.example.com/tenant'] + '-')
              message: >-
                A namespace labelled platform.example.com/tenant=<tenant> must be named <tenant> or <tenant>-<name>.
