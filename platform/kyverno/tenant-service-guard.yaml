# Stops a tenant pointing its own Service or VirtualService at something it does not
# own. The shared gateway is allowed into every tenant namespace, so anything that makes
# it route to another tenant's Service bypasses that tenant's default-deny.
#
# VirtualService destinations: a destination host must be a short name (the
# VirtualService's own namespace) or <svc>.<ns>[.svc[.cluster.local]] with <ns> in the
# same tenant, the tenant being the namespace up to its first hyphen (tenant names have
# no hyphens). External hosts need a platform-owned VirtualService.
#
# externalIPs (CVE-2020-8554): kube-proxy routes traffic for any IP listed in a
# Service's spec.externalIPs to that Service, cluster-wide, so whoever can create a
# Service can intercept traffic to that address from every pod and node.
#
# ExternalName: an ExternalName
# Service resolves to any DNS name, including another tenant's
# <svc>.<ns>.svc.cluster.local, and the shared gateway (allowed into every tenant
# namespace) would then route to it past that tenant's default-deny. Endpoints and
# EndpointSlices, the other way to do this, are kept out by RBAC and the AppProject
# whitelist.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-service-guard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Tenant Service guard
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Service
spec:
  background: true
  rules:
    - name: deny-externalips-and-externalname
      match:
        any:
          - resources:
              kinds: ["Service"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
              message: >-
                Services in tenant namespaces may not set spec.externalIPs (CVE-2020-8554). Use the
                shared gateway, or ask the platform team.
            - expression: "!has(object.spec.type) || object.spec.type != 'ExternalName'"
              message: ExternalName Services are not allowed in tenant namespaces. Ask the platform team for egress to external names.

    - name: virtualservice-destinations-in-tenant
      match:
        any:
          - resources:
              kinds: ["VirtualService"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      validate:
        failureAction: Enforce
        cel:
          variables:
            - name: tenant
              expression: "object.metadata.namespace.split('-')[0]"
            # A host is allowed when it has no dot, or names a namespace in this tenant.
            - name: hostPattern
              expression: >-
                '^[a-z0-9]([-a-z0-9]*[a-z0-9])?\\.' + variables.tenant
                  + '(-[a-z0-9]([-a-z0-9]*[a-z0-9])?)?(\\.svc(\\.cluster\\.local)?)?$'
          expressions:
            - expression: >-
                !has(object.spec.http) || object.spec.http.all(h,
                  (!has(h.route) || h.route.all(r, !r.destination.host.contains('.') || r.destination.host.matches(variables.hostPattern)))
                  && (!has(h.mirror) || !h.mirror.host.contains('.') || h.mirror.host.matches(variables.hostPattern))
                  && (!has(h.mirrors) || h.mirrors.all(m, !m.destination.host.contains('.') || m.destination.host.matches(variables.hostPattern)))
                  && (!has(h.delegate) || !has(h.delegate.namespace)
                      || h.delegate.namespace == variables.tenant || h.delegate.namespace.startsWith(variables.tenant + '-')))
              message: >-
                VirtualService http routes, mirrors and delegates may only target Services in this
                tenant's namespaces.
            - expression: >-
                !has(object.spec.tcp) || object.spec.tcp.all(t, !has(t.route)
                  || t.route.all(r, !r.destination.host.contains('.') || r.destination.host.matches(variables.hostPattern)))
              message: VirtualService tcp routes may only target Services in this tenant's namespaces.
            - expression: >-
                !has(object.spec.tls) || object.spec.tls.all(t, !has(t.route)
                  || t.route.all(r, !r.destination.host.contains('.') || r.destination.host.matches(variables.hostPattern)))
              message: VirtualService tls routes may only target Services in this tenant's namespaces.
