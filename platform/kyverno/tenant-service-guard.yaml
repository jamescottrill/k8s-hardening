# Stops a tenant pointing its own Service at something it does not own.
#
# externalIPs (CVE-2020-8554): kube-proxy routes traffic for any IP listed in a
# Service's spec.externalIPs to that Service, cluster-wide, so whoever can create a
# Service can intercept traffic to that address from every pod and node.
#
# ExternalName: an ExternalName
# Service resolves to any DNS name, including another tenant's
# <svc>.<ns>.svc.cluster.local, and the shared gateway (allowed into every tenant
# namespace) would then route to it past that tenant's default-deny. Endpoints and
# EndpointSlices, the other way to do this, are kept out by RBAC and the AppProject
# whitelist.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-service-guard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: Tenant Service guard
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/subject: Service
spec:
  background: true
  rules:
    - name: deny-externalips-and-externalname
      match:
        any:
          - resources:
              kinds: ["Service"]
              operations: ["CREATE", "UPDATE"]
              namespaceSelector:
                matchExpressions:
                  - key: platform.example.com/tenant
                    operator: Exists
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
              message: >-
                Services in tenant namespaces may not set spec.externalIPs (CVE-2020-8554). Use the
                shared gateway, or ask the platform team.
            - expression: "!has(object.spec.type) || object.spec.type != 'ExternalName'"
              message: ExternalName Services are not allowed in tenant namespaces. Ask the platform team for egress to external names.
