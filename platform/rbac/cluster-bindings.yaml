# OIDC group to cluster-wide profile. Group names must include any --oidc-groups-prefix
# your API server uses (for example oidc:platform-admins). Keep the platform-admins name
# in step with restrict-cluster-admin-bindings and tenant-namespace-guard.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: platform-admins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-operator
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: platform-operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-auditors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-auditor
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: cluster-auditors
