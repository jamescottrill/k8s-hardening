# One central store, read-only, used by the platform for registry credentials.
# conditions limits it to tenant namespaces; restrict-cluster-secret-store (Kyverno)
# stops tenants referencing it themselves.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: platform.example.com/tenant
            operator: Exists
  provider:
    vault:
      server: https://vault.example.com:8200
      path: kv
      version: v2
      # If Vault uses an internal CA, point at it here, e.g.:
      # caProvider:
      #   type: ConfigMap
      #   name: vault-ca
      #   key: ca.crt
      #   namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
