# The shared platform registry credential (for example one Quay robot account with
# read access across the platform organisation), copied into every tenant namespace
# as the platform-registry dockerconfigjson Secret. No Kyverno needed for this one:
# ClusterExternalSecret already fans out by namespace label.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: platform-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  externalSecretName: platform-registry
  namespaceSelectors:
    - matchExpressions:
        - key: platform.example.com/tenant
          operator: Exists
  # How often to look for new matching namespaces.
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: platform-vault
    target:
      name: platform-registry
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        engineVersion: v2
        data:
          .dockerconfigjson: '{"auths":{"{{ .registry }}":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
    data:
      - secretKey: registry
        remoteRef:
          key: platform/registry
          property: registry
      - secretKey: username
        remoteRef:
          key: platform/registry
          property: username
      - secretKey: password
        remoteRef:
          key: platform/registry
          property: password
