# App-of-apps for the tenancy layer. Assumes Argo CD, Kyverno (>= 1.13) and
# External Secrets Operator (>= 0.17, external-secrets.io/v1 API) are already installed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tenancy
  namespace: argocd
  # Deliberately no resources finaliser: cascading would delete the Kyverno guards,
  # RBAC profiles and secret plumbing while tenant Applications (orphaned, because the
  # tenants app-of-apps has no finaliser either) keep running without them. Deleting
  # this Application orphans the whole platform layer instead.
  annotations:
    # Kyverno defaults fields on ClusterPolicies; server-side diff avoids false OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://github.com/example-org/platform-gitops.git
    targetRevision: main
    path: platform
    # Plain directory source: Argo CD does no templating here, so the {{ }} in the
    # Kyverno policies and ESO templates reach the cluster untouched.
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
