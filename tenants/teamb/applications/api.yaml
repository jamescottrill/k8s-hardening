# Platform owned. Plain manifests or Kustomize: no helm block needed.
#
# tenant-application-guard (Kyverno) refuses this Application unless project, name,
# destination and namespace labels all match tenant teamb. Copy this file to add an app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamb-api
  namespace: argocd
  labels:
    platform.example.com/tenant: teamb
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: teamb
  source:
    repoURL: https://github.com/example-org/teamb-api.git
    path: deploy/overlays/prod
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: teamb-api
  syncPolicy:
    automated:
      prune: true
      # Git is the only way to change production.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        platform.example.com/tenant: teamb
        # Must match registry.enabled in tenants/teamb/tenant.yaml
        platform.example.com/tenant-registry: "false"
        # CIS 5.2.1: built-in Pod Security Admission alongside Kyverno
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
