# Platform owned (CODEOWNERS). The tenant name is the directory name: myapp.
# Its namespaces can be "myapp" and anything starting "myapp-".

# Argo CD project role (view, sync, actions, logs) for these groups.
owners:
  groups:
    - myapp-developers
    - myapp-leads

sourceRepos:
  - https://github.com/example-org/myapp-*

registry:
  # myapp has its own Quay organisation; its robot credential lives at kv/tenants/myapp/registry
  enabled: true

# Kubernetes RBAC for OIDC groups. Each entry becomes a RoleBinding (generated by
# Kyverno) in every myapp namespace whose name matches one of the patterns, including
# namespaces created later. Patterns may use * and ?, and must stay within the tenant.
# Roles: tenant-viewer, tenant-developer, tenant-admin (see platform/rbac/tenant-roles.yaml).
access:
  - group: myapp-developers
    role: tenant-developer
    namespaces: ["myapp-dev", "myapp-test*"]
  - group: myapp-developers
    role: tenant-viewer
    namespaces: ["myapp", "myapp-prod"]
  - group: myapp-leads
    role: tenant-admin
    namespaces: ["myapp", "myapp-*"]
  - group: myapp-support
    role: tenant-viewer
    namespaces: ["myapp-prod"]
