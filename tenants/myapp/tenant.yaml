# Platform owned (CODEOWNERS). The tenant name is the directory name: myapp.
# Its namespaces can be "myapp" and anything starting "myapp-".

# Argo CD project role (view, sync, actions, logs) for these groups.
owners:
  groups:
    - myapp-developers
    - myapp-leads

# Exact repo URLs (a glob such as myapp-* would also match another tenant's repos).
sourceRepos:
  - https://github.com/example-org/myapp-web.git
  - https://github.com/example-org/myapp-shared.git

registry:
  # myapp has its own Quay organisation; its robot credential lives at kv/tenants/myapp/registry
  enabled: true

# Kubernetes RBAC for OIDC groups. Each entry becomes a RoleBinding (generated by
# Kyverno) in every myapp namespace whose name matches one of the patterns, including
# namespaces created later. Patterns may use * and ?, and must stay within the tenant.
# Roles (platform/rbac/tenant-roles.yaml):
#   tenant-viewer     read only, no secrets
#   tenant-developer  viewer + exec, port-forward, debug, delete pods, run Jobs
#   tenant-editor     developer + direct changes to workloads; never bound in
#                     productionNamespaces (myapp-prod, myapp-prod-*) whatever the pattern
#   tenant-admin      developer + read secrets, SecretStores, NetworkPolicies
access:
  - group: myapp-developers
    role: tenant-editor
    namespaces: ["myapp-dev", "myapp-test*"]
  - group: myapp-developers
    role: tenant-viewer
    namespaces: ["myapp", "myapp-prod"]
  - group: myapp-leads
    role: tenant-editor
    namespaces: ["myapp-*"]          # production is excluded automatically
  - group: myapp-leads
    role: tenant-admin
    namespaces: ["myapp", "myapp-*"]
  - group: myapp-support
    role: tenant-viewer
    namespaces: ["myapp-prod"]
